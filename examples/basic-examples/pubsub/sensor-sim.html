<script type="text/javascript">
    RED.nodes.registerType('sensor-sim', {
        category: 'node-red-utils examples',
        color: '#c7e9c0',
        defaults: {
            name: { value: '' }
        },
        inputs: 0,
        outputs: 0,
        icon: 'feed.svg',
        label: function() { return this.name || 'sensor-sim'; }
    });
</script>

<script type="text/html" data-template-name="sensor-sim">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="sensor-sim">
    <p>A simulated sensor. A worker thread makes a new reading every 500 ms and offers it on the pub/sub bus as the entry <code>reading</code>.</p>
    <p>Give it a name, deploy, and then pick it in a <code>sensor-view</code> node.</p>
</script>
