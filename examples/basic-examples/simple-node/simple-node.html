<script type="text/javascript">
    RED.nodes.registerType('simple-node', {
        category: 'node-red-utils examples',
        color: '#a6bbcf',
        defaults: {
            name: { value: '' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'function.svg',
        label: function() { return this.name || 'simple-node'; }
    });
</script>

<script type="text/html" data-template-name="simple-node">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="simple-node">
    <p>A simple node that adds a timestamp to messages.</p>
</script>
