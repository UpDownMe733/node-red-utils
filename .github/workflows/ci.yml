name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Pack and load the tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          npm init -y
          npm install "$RUNNER_TEMP"/nrutils-node-red-utils-*.tgz
          node -e "const u = require('@nrutils/node-red-utils'); if (!u.NodeRedNodeBase) process.exit(1)"
